[package]
name = "voice-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "VoicePilot AI — Media Plane frame scheduler and latency bench (Fase 0, modulo 0.1)"
publish = false

# Zero dependencies, deliberately.
#
# This crate sits in the hot path of a real-time audio pipeline. Every
# dependency is a supply-chain risk, a compile-time cost, and a source of
# allocations we do not control. std is enough for frame scheduling,
# deterministic time, and histograms. See ../README.md.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "latency-bench"
path = "src/bin/latency-bench.rs"
