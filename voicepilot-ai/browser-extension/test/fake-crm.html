<label>Etapa <input id="stage" readonly /></label>
<script>
  // A framework that tracks its own state and ignores a plain .value
  // assignment — exactly the case content.js's native-setter dance exists
  // for. If the extension writes naively, this stays empty.
  const note = document.getElementById("note");
  let shadow = "";
  note.addEventListener("input", () => { shadow = note.value; });
  window.__shadowNote = () => shadow;
</script>
