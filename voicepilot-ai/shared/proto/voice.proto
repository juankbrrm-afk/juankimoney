// VoicePilot AI — Media Plane <-> Intelligence Plane contract.
//
// This is the seam described in `docs/01-arquitectura.md`: the Rust Voice
// Engine on one side, the Python inference services on the other. It is the
// single most latency-sensitive interface in the system, and every decision
// below exists to protect the 20 ms frame cadence.
//
// Design rules this contract enforces:
//
//   1. **Bidirectional streaming, never unary.** A unary RPC per frame means
//      an HTTP/2 request every 20 ms — 50 round trips per second per call,
//      each paying header serialisation and flow-control accounting. The
//      stream is opened once when the session is provisioned and lives for the
//      whole call.
//
//   2. **`capture_timestamp_ns` travels out and back.** Latency is measured
//      end to end from the frame's own timestamp, not estimated by summing
//      per-stage guesses. `docs/02` §2.1 depends on this.
//
//   3. **`seq` correlates request to response.** Responses may arrive out of
//      order across a network; the scheduler indexes by sequence number, so
//      reordering is tolerated and lateness is detected rather than assumed.
//
//   4. **The server may drop, but must say so.** Silence is indistinguishable
//      from a dead link. An explicit `Dropped` response frees the client's
//      in-flight slot immediately instead of waiting for a timeout.
//
//   5. **No business concepts.** No leads, no tenants-as-policy, no CRM. The
//      Intelligence Plane receives audio and the context it needs, and returns
//      audio. That ignorance is what makes it independently testable and
//      replaceable.

syntax = "proto3";

package voicepilot.voice.v1;

option go_package = "github.com/voicepilot/proto/voice/v1;voicev1";

// ---------------------------------------------------------------------------
// Voice conversion — the Mode A / Mode B hot path
// ---------------------------------------------------------------------------

service VoiceProcessor {
  // Opened once per call, at session provisioning time — never mid-call. See
  // `SessionConfig.warmup` and `docs/05` on the pre-warmed session pool: model
  // load and first-inference warm-up cost 300-900 ms, and paying that after
  // the customer has answered ruins the greeting, which is the most important
  // moment of the call.
  rpc Process(stream ProcessRequest) returns (stream ProcessResponse);

  // Liveness and capacity. Polled by the Media Plane's session pool, never in
  // the audio path.
  rpc Health(HealthRequest) returns (HealthResponse);
}

message ProcessRequest {
  oneof payload {
    // Always the first message on the stream.
    SessionConfig config = 1;
    AudioFrame frame = 2;
    // Mid-call mode change, e.g. the agent switches from Mode A to Mode B.
    ModeChange mode_change = 3;
  }
}

message SessionConfig {
  string call_id = 1;
  string tenant_id = 2;
  Mode mode = 3;

  // Identifier of a **licensed** target voice from the library. Deliberately
  // not a voice sample: the system cannot be asked to clone an arbitrary
  // voice. That is a product restriction, and it is the line between a tool
  // and a fraud instrument (`docs/09`).
  string target_voice_id = 4;

  // Speaker embedding of the agent, used for target-speaker extraction on a
  // noisy call-centre floor. Requires recorded consent — enforced by a NOT
  // NULL constraint on `agent_voice_profiles.consent_recorded_at`.
  bytes agent_speaker_embedding = 5;
  string embedding_version = 6;

  // BCP-47. Mode B translates source -> target; Mode A requires them equal.
  string source_language = 7;
  string target_language = 8;

  AudioFormat format = 9;

  // Frames the server may hold before it must start refusing. Derived by the
  // client from the model's inherent pipeline depth plus slack, in chunks.
  // See `docs/02` — specifying this as an absolute frame count discarded 46%
  // of a healthy call.
  uint32 max_inflight_frames = 10;
}

message ModeChange {
  Mode mode = 1;
  string target_voice_id = 2;
}

enum Mode {
  MODE_UNSPECIFIED = 0;
  // Same language, accent and timbre conversion. Frame-synchronous.
  MODE_A_CONVERSION = 1;
  // Cross-language. Carries an irreducible commit delay; see `docs/02`.
  MODE_B_TRANSLATION = 2;
  // Passthrough. The stream stays open so the session is not lost.
  MODE_OFF = 3;
}

message AudioFormat {
  uint32 sample_rate_hz = 1;  // 24000
  uint32 frame_samples = 2;   // 480 (20 ms)
  uint32 channels = 3;        // 1
  Encoding encoding = 4;

  enum Encoding {
    ENCODING_UNSPECIFIED = 0;
    ENCODING_PCM_F32LE = 1;
  }
}

message AudioFrame {
  uint64 seq = 1;

  // Timestamp of the frame's FIRST sample at the microphone. Returned
  // unmodified in the matching response. This is what makes mouth-to-ear
  // latency a measurement instead of a sum of estimates.
  uint64 capture_timestamp_ns = 2;

  Speaker speaker = 3;
  bytes pcm = 4;

  // The client's VAD decision. The server may skip inference entirely on
  // silence — unit-economics lever #4, worth ~20% of GPU spend (`docs/11`).
  bool voice_active = 5;
}

enum Speaker {
  SPEAKER_UNSPECIFIED = 0;
  SPEAKER_AGENT = 1;
  SPEAKER_CUSTOMER = 2;
}

message ProcessResponse {
  oneof payload {
    SessionReady ready = 1;
    ProcessedFrame frame = 2;
    // The server will not produce this frame. Explicit, never silent: an
    // unanswered request is indistinguishable from a dead link, and the client
    // would hold the in-flight slot until timeout for nothing.
    FrameDropped dropped = 3;
    ServerStatus status = 4;
  }
}

// Sent once, when the model is loaded and warm. The client must not send audio
// before receiving it — that is the entire point of pre-warming.
message SessionReady {
  string session_id = 1;
  uint64 warmup_duration_ns = 2;
  // Nominal delay this model adds: chunk wait + inference + any lookahead
  // beyond the chunk. The client sizes its playout offset from this.
  uint64 pipeline_delay_ns = 3;
  string model_version = 4;
}

message ProcessedFrame {
  uint64 seq = 1;
  uint64 capture_timestamp_ns = 2;  // echoed unchanged
  bytes pcm = 3;

  // Server-side compute for this frame, excluding transport. Lets the client
  // separate "the model is slow" from "the network is slow" — two problems
  // with completely different fixes.
  uint64 inference_duration_ns = 4;

  ProcessingState state = 5;
  string model_version = 6;
}

enum ProcessingState {
  PROCESSING_STATE_UNSPECIFIED = 0;
  PROCESSING_STATE_OK = 1;
  // Still converting, but the server is behind. The client should expect
  // lateness before it happens.
  PROCESSING_STATE_DEGRADED = 2;
  // The server is asking the client to bypass. Advisory: the decision belongs
  // to the Voice Engine, which owns the invariant.
  PROCESSING_STATE_BYPASS_RECOMMENDED = 3;
}

message FrameDropped {
  uint64 seq = 1;
  DropReason reason = 2;

  enum DropReason {
    DROP_REASON_UNSPECIFIED = 0;
    DROP_REASON_BACKPRESSURE = 1;
    DROP_REASON_INFERENCE_ERROR = 2;
    DROP_REASON_SESSION_RESET = 3;
  }
}

message ServerStatus {
  ProcessingState state = 1;
  uint32 inflight_frames = 2;
  float gpu_utilisation = 3;
  string detail = 4;
}

message HealthRequest {}

message HealthResponse {
  bool ready = 1;
  uint32 active_sessions = 2;
  uint32 capacity_sessions = 3;
  string model_version = 4;
  uint64 warm_sessions_available = 5;
}
