<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Innovation Xperience — Logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Archivo',sans-serif; background:#0a0a0a; }
  .stage{
    width:1200px; padding:80px; display:flex; flex-direction:column; gap:60px;
  }
  .row{ display:flex; align-items:center; gap:60px; padding:60px; }
  .bg-black{ background:#0a0a0a; }
  .bg-white{ background:#f5f4f0; }
  .bg-champagne{ background:#1b1712; }

  .lockup{ display:flex; align-items:center; gap:28px; }
  .divider{ width:1px; align-self:stretch; opacity:.5; }
  .word{ display:flex; flex-direction:column; line-height:1; }
  .word span{ font-weight:800; font-size:34px; letter-spacing:.08em; }
  .word .l1{ margin-bottom:6px; }
  .accent{ }

  .mark{ width:96px; height:96px; }

  .label{ color:#8a8a86; font-size:12px; letter-spacing:.2em; text-transform:uppercase; margin-bottom:18px; font-weight:500; }
</style>
</head>
<body>
<div class="stage">

  <div>
    <div class="label">Lockup — Ivory on Black</div>
    <div class="row bg-black" style="width:900px;">
      <svg class="mark" viewBox="0 0 120 120" fill="none">
        <line x1="30" y1="30" x2="90" y2="90" stroke="#f5f4f0" stroke-width="14" stroke-linecap="round"/>
        <line x1="90" y1="30" x2="30" y2="90" stroke="#f5f4f0" stroke-width="6" stroke-linecap="round"/>
      </svg>
      <div class="divider" style="background:#f5f4f0;"></div>
      <div class="word" style="color:#f5f4f0;">
        <span class="l1">INNOVATION</span>
        <span><tspan class="accent" style="color:#cbaa6c;">X</tspan>PERIENCE</span>
      </div>
    </div>
  </div>

  <div>
    <div class="label">Lockup — Black on Ivory</div>
    <div class="row bg-white" style="width:900px;">
      <svg class="mark" viewBox="0 0 120 120" fill="none">
        <line x1="30" y1="30" x2="90" y2="90" stroke="#0a0a0a" stroke-width="14" stroke-linecap="round"/>
        <line x1="90" y1="30" x2="30" y2="90" stroke="#0a0a0a" stroke-width="6" stroke-linecap="round"/>
      </svg>
      <div class="divider" style="background:#0a0a0a;"></div>
      <div class="word" style="color:#0a0a0a;">
        <span class="l1">INNOVATION</span>
        <span><tspan class="accent" style="color:#b8722f;">X</tspan>PERIENCE</span>
      </div>
    </div>
  </div>

  <div>
    <div class="label">Lockup — Champagne Gold (Frank's / event decks)</div>
    <div class="row bg-champagne" style="width:900px;">
      <svg class="mark" viewBox="0 0 120 120" fill="none">
        <line x1="30" y1="30" x2="90" y2="90" stroke="#cbaa6c" stroke-width="14" stroke-linecap="round"/>
        <line x1="90" y1="30" x2="30" y2="90" stroke="#e6d3ab" stroke-width="6" stroke-linecap="round"/>
      </svg>
      <div class="divider" style="background:#cbaa6c;"></div>
      <div class="word" style="color:#e6d3ab;">
        <span class="l1">INNOVATION</span>
        <span><tspan class="accent" style="color:#cbaa6c;">X</tspan>PERIENCE</span>
      </div>
    </div>
  </div>

  <div>
    <div class="label">Icon Mark Only — Ivory / Gold</div>
    <div class="row bg-black" style="width:280px; justify-content:center; gap:0;">
      <svg class="mark" style="width:140px; height:140px;" viewBox="0 0 120 120" fill="none">
        <line x1="30" y1="30" x2="90" y2="90" stroke="#f5f4f0" stroke-width="14" stroke-linecap="round"/>
        <line x1="90" y1="30" x2="30" y2="90" stroke="#cbaa6c" stroke-width="6" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

</div>
</body>
</html>
