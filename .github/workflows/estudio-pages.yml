# Publica el estudio en GitHub Pages.
#
# El microfono solo se puede abrir desde una pagina servida por HTTPS y en su
# propia pestaña: dentro de un visor incrustado el navegador lo bloquea. Esto
# deja el estudio en una direccion propia.
#
# La publicacion va por la rama `gh-pages` y no por la API de Pages. El token
# del flujo puede escribir en el repositorio, pero no puede *crear* el sitio de
# Pages —eso pide permisos de administracion que ese token nunca tiene— asi que
# `actions/configure-pages` con `enablement: true` falla. Empujando a `gh-pages`
# el sitio se crea solo y luego se actualiza en cada cambio.
name: Publicar el estudio

on:
  push:
    # La rama principal de este repositorio, que no es main.
    branches: [claude/brand-identity-visual-language-6i9w55]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.studio.config.ts'
      - 'studio.html'
      - 'scripts/inline-studio.mjs'
      - '.github/workflows/estudio-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-estudio
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:studio

      - name: Montar el sitio
        run: |
          mkdir -p _site/estudio
          cp dist-studio/estudio.html _site/estudio/index.html
          # La raiz redirige al estudio, que es lo unico que se publica aqui.
          printf '<meta http-equiv="refresh" content="0; url=./estudio/">\n' > _site/index.html
          # Sin esto Pages pasaria el sitio por Jekyll y se comeria algun archivo.
          touch _site/.nojekyll

      - name: Publicar en gh-pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --depth=1 origin gh-pages
          git worktree add ../publicacion -B gh-pages origin/gh-pages
          # El sitio se reemplaza entero, pero conservando el historial de la rama.
          find ../publicacion -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r _site/. ../publicacion/
          cd ../publicacion
          git add -A
          if git diff --cached --quiet; then
            echo 'El sitio no ha cambiado.'
            exit 0
          fi
          git commit -m "Publicar el estudio (${GITHUB_SHA::7})"
          git push origin gh-pages
